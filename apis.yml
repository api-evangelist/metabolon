aid: metabolon
name: Metabolon
description: >-
  Metabolon, Inc. is the metabolomics contract research and software company headquartered in Morrisville,
  North Carolina. It runs the Global Discovery Panel and a family of targeted and untargeted metabolomics,
  lipidomics and microbiome panels for pharma, biotech, academic and clinical-research customers, and
  delivers the resulting biochemical data through MyMetabolon — a customer portal fronting an Integrated
  Bioinformatics Platform of pathway, heatmap, discovery-panel and multiomics analysis tools. Metabolon
  publishes no public developer program or API reference, but the portal is a React single-page app backed
  by four publicly reachable ASP.NET services on *.prod.metabolon.com whose NSwag-generated OpenAPI 3.0
  documents are served unauthenticated at /swagger/v1/swagger.json, and customer sign-in runs on a
  Metabolon-branded Auth0 tenant at auth0.metabolon.com with full OIDC discovery.
