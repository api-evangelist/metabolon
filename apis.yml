apis:
- name: Metabolon Portal API
  description: >-
    The backend REST API for the MyMetabolon customer portal (portal.metabolon.com). 248 operations across
    18 tags — Users, Auth, Projects, Files, SampleSetsInfo, SpectralData, StudyBuilder, Reports, Search,
    Eula, SharedFile, Decentralization, LabVantageFiles, PipelineStatus, Status and Health — covering project
    and sample-set retrieval, result-file listing/search/download bundles, spectral-data download links,
    study-builder quoting, Auth0 registration/post-login hooks, EULA management and administrative
    user/role/permission management. Every path is published in parallel under /api/v1 and /api/v2. The
    OpenAPI is served publicly and unauthenticated; the operations themselves require an Auth0 bearer token
    and a portal account. Metabolon publishes no developer documentation for this surface.
  humanURL: https://www.metabolon.com/support/portal/
  baseURL: https://portal-api.prod.metabolon.com
  tags:
  - Metabolomics
  - Bioinformatics
  - Life Sciences
  - Project Management
  - File Delivery
  - Spectral Data
  properties:
  - type: OpenAPI
    url: openapi/metabolon-portal-api-openapi.yml
  - type: Overlay
    url: overlays/metabolon-portal-api-overlay.yaml
  - type: Documentation
    url: https://www.metabolon.com/support/portal/
  - type: Login
    url: https://portal.metabolon.com/login
- name: Metabolon Discovery Panels API
  description: >-
    ASP.NET service backing the Discovery Panel views of the Metabolon Integrated Bioinformatics Platform.
    Its public NSwag OpenAPI document (DiscoveryPanelsApi v1) exposes only the ten health, ping, deep-ping
    and Datadog monitoring operations under /api/v1 and /api/v2; the analytical operations the portal calls
    are not present in the published document.
  humanURL: https://www.metabolon.com/bioinformatics-software/
  baseURL: https://discovery.prod.metabolon.com
  tags:
  - Bioinformatics
  - Metabolomics
  - Health Check
  properties:
  - type: OpenAPI
    url: openapi/metabolon-discovery-panels-api-openapi.yml
  - type: Overlay
    url: overlays/metabolon-discovery-panels-api-overlay.yaml
- name: Metabolon Pathway Explorer API
  description: >-
    ASP.NET service backing the Pathway Explorer visualization in the Metabolon Integrated Bioinformatics
