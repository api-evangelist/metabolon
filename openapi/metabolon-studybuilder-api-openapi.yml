components:
  schemas:
    QuoteSummaryEmailResponse:
      type: object
      additionalProperties: false
      properties:
        accepted:
          type: boolean
        duplicate:
          type: boolean
    QuoteSummaryContactDto:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
    StudyBuilderEstimateRequestDto:
      type: object
      additionalProperties: false
      properties:
        businessType:
          type:
          - string
          - 'null'
          description: Optional override. When omitted, authenticated users resolve Business Line from Salesforce; guests refer to sales.
        statsServices:
          type:
          - string
          - 'null'
        interpretationLevel:
          type:
          - string
          - 'null'
        sampleCount:
          type: integer
          format: int32
        selections:
          description: Quote Builder fit-phase selections (full wizard state).
        quoteDraft:
          description: Quote Builder quote-phase draft (line items, sample logistics, etc.).
    StudyBuilderEstimateDraftRequestDto:
      type: object
      additionalProperties: false
      properties:
        sampleCount:
          type: integer
          format: int32
          maximum: 2147483647.0
          minimum: 1.0
        selections: {}
        quoteDraft: {}
    ProblemDetails:
      type: object
      additionalProperties: {}
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
    QuoteSummaryEmailRequest:
      type: object
      additionalProperties: false
      properties:
        toEmail:
          type:
          - string
          - 'null'
        contact:
          oneOf:
          - $ref: '#/components/schemas/QuoteSummaryContactDto'
        plainTextBody:
          type:
          - string
          - 'null'
        submittedAt:
          type:
          - string
          - 'null'
          description: ISO-8601 timestamp from the client (optional).
          format: date-time
    StudyBuilderEstimateResponseDto:
      type: object
      additionalProperties: false
      properties:
        status:
          type:
          - string
          - 'null'
        businessType:
          type:
          - string
          - 'null'
        serviceTier:
          type:
          - string
          - 'null'
        sampleCountTier:
          type:
          - string
          - 'null'
        minEstimateAmount:
          type:
          - number
          - 'null'
          format: decimal
        maxEstimateAmount:
          type:
          - number
          - 'null'
          format: decimal
        maxEstimateIsOpenEnded:
          type: boolean
        referToSales:
          type: boolean
        estimatedCostDisplay:
          type:
          - string
          - 'null'
        effectiveStartUtc:
          type:
          - string
          - 'null'
          format: date-time
    StudyBuilderEstimateDraftGetResponseDto:
      type: object
      additionalProperties: false
      properties:
        sampleCount:
          type: integer
          format: int32
        selections: {}
        quoteDraft: {}
    StudyBuilderEstimateDraftResponseDto:
