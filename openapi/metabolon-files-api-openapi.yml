  /api/v1/files/project/{projectId}:
    get:
      tags:
      - Files
      summary: Retrieves all of the files for a specific project
      operationId: Files_GetFilesByProjectId
      parameters:
      - name: projectId
        in: path
        required: true
        description: The projectId to search on
        schema:
          type: string
          format: guid
        x-position: 1
      responses:
        '200':
          description: A [possibly empty] enumeration of File items was returned
          content:
