components:
  schemas:
    PublishParametersProjectFile:
      allOf:
      - $ref: '#/components/schemas/PublishParametersOfProjectFile'
      - type: object
        additionalProperties: false
    ProjectFileRecord:
      allOf:
      - $ref: '#/components/schemas/FileRecord'
      - type: object
        additionalProperties: false
        properties:
          fileId:
            type: string
            format: guid
          projectId:
            type: string
            format: guid
          staged:
            type: boolean
          name:
            type:
            - string
            - 'null'
          description:
            type:
            - string
            - 'null'
          createdBy:
            type:
            - string
            - 'null'
          managed:
            type: boolean
          customerVisible:
            type: boolean
          customerDate:
            type:
            - string
            - 'null'
            format: date-time
    FileRecord:
      allOf:
      - $ref: '#/components/schemas/Record'
      - type: object
        additionalProperties: false
        properties:
          size:
            type: integer
            format: int64
          mimeType:
            type:
            - string
            - 'null'
    PublishParametersGuid:
      allOf:
      - $ref: '#/components/schemas/PublishParametersOfGuid'
      - type: object
        additionalProperties: false
    PublishParametersOfIEnumerableOfProjectFile:
      type: object
      additionalProperties: false
      properties:
        instance:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ProjectFile'
        comment:
          type:
          - string
          - 'null'
    PublishParametersOfGuid:
      type: object
      additionalProperties: false
      properties:
        instance:
          type: string
          format: guid
        comment:
          type:
          - string
          - 'null'
    PublishParametersOfProjectFile:
      type: object
      additionalProperties: false
      properties:
        instance:
          oneOf:
          - $ref: '#/components/schemas/ProjectFile'
        comment:
          type:
          - string
          - 'null'
    Record:
      type: object
      x-abstract: true
      additionalProperties: false
      properties:
        createdDate:
          type:
          - string
          - 'null'
          format: date-time
        modifiedDate:
          type:
          - string
          - 'null'
          format: date-time
    PublishParametersProjectFiles:
      allOf:
      - $ref: '#/components/schemas/PublishParametersOfIEnumerableOfProjectFile'
      - type: object
        additionalProperties: false
    ProjectFile:
      type: object
