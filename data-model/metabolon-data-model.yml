identifier_conventions:
- field: projectId
  shape: uuid
  note: primary key for a customer study; path parameter on most Files/SampleSets/SpectralData/Reports operations
- field: projectCode
  shape: string
  note: human-facing project code; addressable via GET /api/v1/projects/projectCode/{projectCode}
- field: limsProjectId
  shape: string
  note: foreign key into the LabVantage LIMS
- field: correlationId
  shape: string
  note: pipeline-status trace identifier, also accepted as a query filter
- field: subjectId / parentSubjectId
  shape: string
  note: pipeline fact subject hierarchy
- field: salesforceLeadId
  shape: string
  note: foreign key into Salesforce for pending-user approval
- field: talentLmsUserId / branchId
  shape: string
  note: foreign keys into the TalentLMS learning centre
external_systems:
- name: Auth0
  role: identity provider (auth0.metabolon.com); pre-user-registration and post-login webhooks are first-class operations
- name: Salesforce
  role: user approval / pending-user sync; 503 is returned when Salesforce is unavailable
- name: TalentLMS
  role: learning-centre account sync
- name: LabVantage
  role: laboratory information management system feeding result files
- name: Datadog
  role: health-check and service-check monitoring endpoints exposed on every service
