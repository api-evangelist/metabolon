domain_standard:
  applicable: false
  note: >-
    Metabolon operates in metabolomics contract research. Its regulated obligations are laboratory and
    clinical-trial standards (CLIA, CAP, ISO 9001, GCP/GCLP, ICH M10), which are process accreditations,
    not machine-readable interchange contracts. Community metabolomics data standards do exist (mzML,
    MetaboLights/MetabolomeXchange, the MSI reporting standards), but the published Metabolon contract
    declares none of them — result files are delivered as opaque downloads through the Files and
    SpectralData operations, whose response schemas expose only file metadata and pre-signed download
    links, not typed spectral records. Recorded as not-applicable rather than non-conformant.
